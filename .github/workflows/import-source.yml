name: Import Courier source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack the Courier source bundle
        run: |
          curl -fsSL --retry 3 -o /tmp/courier-src.tgz "https://litter.catbox.moe/vq2lyd.tgz"
          tar xzf /tmp/courier-src.tgz -C .
          rm -rf .github

      - name: Commit the project
        run: |
          git config user.name "Courier"
          git config user.email "courier@users.noreply.github.com"
          git add -A
          git commit -m "Port the Telegram-iOS interface to a real Android client"
          git push origin HEAD:main
