name: Flutter APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.1"
  UNIVERSAL_APK: Courier-1.0-universal.apk
  ARM64_APK: Courier-1.0-arm64.apk
  ARM_APK: Courier-1.0-arm.apk
  DEBUG_APK: Courier-1.0-debug.apk

jobs:
  build:
    name: Build stable and debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      # Two release shapes: one universal APK for phones that should not have to
      # know their ABI, and per-ABI APKs (R8-shrunk, single TDLib binary) that are
      # roughly a third of the universal size.
      - name: Build release APKs
        run: |
          mkdir -p dist
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${UNIVERSAL_APK}"
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/${ARM64_APK}"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/${ARM_APK}"

      - name: Collect APKs
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/${DEBUG_APK}"
          cd dist
          sha256sum "${UNIVERSAL_APK}" "${ARM64_APK}" "${ARM_APK}" "${DEBUG_APK}" > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: courier-stable-apk
          path: |
            dist/${{ env.UNIVERSAL_APK }}
            dist/${{ env.ARM64_APK }}
            dist/${{ env.ARM_APK }}
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: courier-debug-apk
          path: dist/${{ env.DEBUG_APK }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: courier-latest
          name: Courier 1.0 — stable + debug
          body: |
            Courier rewritten in Flutter with the liquid-glass renderer and TDLib
            as the Telegram engine.

            Download the smallest APK that matches your phone:

            - `Courier-1.0-arm64.apk` — 64-bit ARM (every phone from roughly 2017
              on). **Start here.**
            - `Courier-1.0-arm.apk` — 32-bit ARM, for older or low-end phones.
            - `Courier-1.0-universal.apk` — both ARM ABIs in one file, if you are
              not sure.
            - `Courier-1.0-debug.apk` — debug build for diagnostics.

            The stable APKs are R8-shrunk and debug-key signed so they install
            without a private keystore; that is not a Play Store upload.
            `SHA256SUMS.txt` has the checksums for every file.

            Every file is built from `${{ github.sha }}`. Android 8.0+ (minSdk 26).
            Sign in with your own Telegram phone number; Telegram may ask for the
            login code and, if enabled, your 2FA password.
          files: |
            dist/${{ env.UNIVERSAL_APK }}
            dist/${{ env.ARM64_APK }}
            dist/${{ env.ARM_APK }}
            dist/${{ env.DEBUG_APK }}
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: false

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/.gradle
            build/reports
          if-no-files-found: ignore
