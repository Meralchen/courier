name: Flutter APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.1"
  STABLE_APK: Courier-1.0-stable.apk
  DEBUG_APK: Courier-1.0-debug.apk

jobs:
  build:
    name: Build stable and debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build stable APK
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/${DEBUG_APK}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${STABLE_APK}"
          cd dist
          sha256sum "${STABLE_APK}" "${DEBUG_APK}" > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: courier-stable-apk
          path: dist/${{ env.STABLE_APK }}
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: courier-debug-apk
          path: dist/${{ env.DEBUG_APK }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: courier-latest
          name: Courier 1.0 — stable + debug
          body: |
            Courier rewritten in Flutter with the liquid-glass renderer and TDLib
            as the Telegram engine.

            - `Courier-1.0-stable.apk` — release build (debug-signed so it installs
              without a private keystore; not a Play Store upload).
            - `Courier-1.0-debug.apk` — debug build for diagnostics.
            - `SHA256SUMS.txt` — checksums for both files.

            Both are built from `${{ github.sha }}`. Android 8.0+ (minSdk 26).
            Sign in with your own Telegram phone number; Telegram may ask for the
            login code and, if enabled, your 2FA password.
          files: |
            dist/${{ env.STABLE_APK }}
            dist/${{ env.DEBUG_APK }}
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: false

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/.gradle
            build/reports
          if-no-files-found: ignore
